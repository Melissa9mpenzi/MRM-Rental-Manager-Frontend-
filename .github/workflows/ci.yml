name: Frontend CI

on:
  push:
    branches: [main, master, feature-fix, develop]
  pull_request:
    branches: [main, master, feature-fix, develop]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint (non-blocking)
        continue-on-error: true
        run: npm run lint

      - name: Production build
        env:
          VITE_API_URL: https://mrm-rental-manager-backend.vercel.app
          VITE_GOV_API_URL: https://mrm-rental-manager-backend.vercel.app
          VITE_SUI_NETWORK: testnet
        run: npm run build
